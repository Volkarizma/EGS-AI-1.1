<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dost Asistan - Özel Gereksinimli Bireyler İçin Sesli ve Yazılı Asistan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons for clear visual iconography -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            },
            accessible: {
              bg: '#f8fafc',
              card: '#ffffff',
              text: '#0f172a',
              border: '#94a3b8'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom High Contrast Styles */
    .high-contrast {
      background-color: #000000 !important;
      color: #ffff00 !important;
    }
    .high-contrast * {
      background-color: #000000 !important;
      color: #ffff00 !important;
      border-color: #ffff00 !important;
    }
    .high-contrast button {
      border: 3px solid #ffff00 !important;
    }
    .high-contrast button:hover {
      background-color: #ffff00 !important;
      color: #000000 !important;
    }
    /* Pulse effect for recording */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .recording-pulse {
      animation: pulse-ring 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-full bg-slate-100 text-slate-900 font-sans antialiased flex flex-col transition-all duration-300">

  <!-- Header / Accessibility Bar -->
  <header class="bg-white border-b-4 border-sky-600 shadow-md p-3 sm:p-4 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Title & Status -->
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 bg-sky-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-sm">
          <i class="ph-bold ph-heart"></i>
        </div>
        <div>
          <h1 id="app-title" class="text-xl sm:text-2xl font-bold text-sky-900 tracking-tight">Dost Asistan</h1>
          <p class="text-xs font-bold text-sky-600">Created by Egemen Şeker</p>
          <p class="text-xs sm:text-sm font-semibold text-slate-600">Her Zaman Yanındayım</p>
        </div>
      </div>

      <!-- Accessibility Tool Buttons -->
      <div class="flex items-center flex-wrap gap-2">
        <!-- Font Size Controls -->
        <div class="flex items-center bg-slate-100 rounded-xl p-1 border-2 border-slate-300">
          <button id="btn-font-decrease" aria-label="Yazıyı küçült" title="Yazıyı Küçült" class="px-3 py-1.5 text-lg font-bold rounded-lg hover:bg-slate-200 active:bg-slate-300 focus:ring-2 focus:ring-sky-500">
            A-
          </button>
          <span class="text-xs font-bold px-1 text-slate-500">BOYUT</span>
          <button id="btn-font-increase" aria-label="Yazıyı büyüt" title="Yazıyı Büyüt" class="px-3 py-1.5 text-lg font-bold rounded-lg hover:bg-slate-200 active:bg-slate-300 focus:ring-2 focus:ring-sky-500">
            A+
          </button>
        </div>

        <!-- High Contrast Mode -->
        <button id="btn-contrast" aria-label="Yüksek kontrast modu" title="Yüksek Kontrast Modu" class="flex items-center space-x-1.5 px-3 py-2 bg-slate-800 text-white rounded-xl font-bold border-2 border-slate-900 hover:bg-slate-700 focus:ring-2 focus:ring-sky-500">
          <i class="ph-bold ph-eye text-lg"></i>
          <span class="text-sm hidden sm:inline">Kontrast</span>
        </button>

        <!-- Speech Speed Control -->
        <button id="btn-speech-speed" aria-label="Ses hızını değiştir" title="Konuşma Hızı" class="flex items-center space-x-1.5 px-3 py-2 bg-sky-100 text-sky-900 border-2 border-sky-300 rounded-xl font-bold hover:bg-sky-200 focus:ring-2 focus:ring-sky-500">
          <i class="ph-bold ph-gauge text-lg"></i>
          <span id="speed-label" class="text-sm">Normal Hız</span>
        </button>

        <!-- Mute Toggle -->
        <button id="btn-mute" aria-label="Sesi kapat veya aç" title="Sesi Aç/Kapat" class="p-2 bg-emerald-100 text-emerald-900 border-2 border-emerald-300 rounded-xl font-bold hover:bg-emerald-200 focus:ring-2 focus:ring-emerald-500">
          <i id="mute-icon" class="ph-bold ph-speaker-high text-xl"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 flex flex-col gap-4 overflow-hidden">
    
    <!-- Quick Action Cards (Easy Prompts) -->
    <section aria-labelledby="quick-cards-title" class="bg-white p-3 sm:p-4 rounded-2xl border-2 border-slate-200 shadow-sm">
      <h2 id="quick-cards-title" class="text-sm font-bold text-slate-500 mb-2 uppercase tracking-wide flex items-center space-x-2">
        <i class="ph-bold ph-sparkle text-amber-500 text-lg"></i>
        <span>Hızlı Seçenekler (Dokun ve Sor)</span>
      </h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
        
        <button onclick="sendQuickPrompt('Bugün ne yapabilirim?')" class="flex flex-col items-center justify-center p-3 bg-sky-50 hover:bg-sky-100 border-2 border-sky-200 rounded-xl text-sky-900 transition focus:ring-4 focus:ring-sky-400">
          <i class="ph-bold ph-calendar-check text-2xl mb-1 text-sky-600"></i>
          <span class="text-xs sm:text-sm font-bold text-center">Bugün Ne Yapayım?</span>
        </button>

        <button onclick="sendQuickPrompt('Bugün nasıl hissediyorum? Duygularımı anlamama yardım et.')" class="flex flex-col items-center justify-center p-3 bg-rose-50 hover:bg-rose-100 border-2 border-rose-200 rounded-xl text-rose-900 transition focus:ring-4 focus:ring-rose-400">
          <i class="ph-bold ph-smiley text-2xl mb-1 text-rose-600"></i>
          <span class="text-xs sm:text-sm font-bold text-center">Duygularım</span>
        </button>

        <button onclick="sendQuickPrompt('Bana yardım eder misin? Kendimi biraz karışık hissediyorum.')" class="flex flex-col items-center justify-center p-3 bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 rounded-xl text-amber-900 transition focus:ring-4 focus:ring-amber-400">
          <i class="ph-bold ph-hand-heart text-2xl mb-1 text-amber-600"></i>
          <span class="text-xs sm:text-sm font-bold text-center">Yardım İstiyorum</span>
        </button>

        <button onclick="sendQuickPrompt('Günlük rutinimi hatırlamama yardım et.')" class="flex flex-col items-center justify-center p-3 bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-200 rounded-xl text-indigo-900 transition focus:ring-4 focus:ring-indigo-400">
          <i class="ph-bold ph-clock text-2xl mb-1 text-indigo-600"></i>
          <span class="text-xs sm:text-sm font-bold text-center">Günlük Rutinim</span>
        </button>

        <button onclick="sendQuickPrompt('Bugün hava nasıl olmalı ve ne giymeliyim?')" class="flex flex-col items-center justify-center p-3 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-200 rounded-xl text-emerald-900 transition focus:ring-4 focus:ring-emerald-400">
          <i class="ph-bold ph-cloud-sun text-2xl mb-1 text-emerald-600"></i>
          <span class="text-xs sm:text-sm font-bold text-center">Hava & Giysi</span>
        </button>

        <button onclick="sendQuickPrompt('Bana güzel ve mutlu edecek bir söz söyler misin?')" class="flex flex-col items-center justify-center p-3 bg-purple-50 hover:bg-purple-100 border-2 border-purple-200 rounded-xl text-purple-900 transition focus:ring-4 focus:ring-purple-400">
          <i class="ph-bold ph-sun text-2xl mb-1 text-purple-600"></i>
          <span class="text-xs sm:text-sm font-bold text-center">Günün Sözü</span>
        </button>

      </div>
    </section>

    <!-- Chat History / Messages Display Area -->
    <section aria-label="Sohbet Geçmişi" class="flex-1 bg-white rounded-2xl border-2 border-slate-200 shadow-sm p-4 overflow-y-auto flex flex-col space-y-4" id="chat-box">
      <!-- Welcome Message -->
      <div class="flex items-start space-x-3 bg-sky-50 p-4 rounded-2xl border-2 border-sky-100 max-w-2xl">
        <div class="w-10 h-10 bg-sky-500 rounded-full flex items-center justify-center text-white text-xl flex-shrink-0">
          <i class="ph-bold ph-robot"></i>
        </div>
        <div class="flex-1 space-y-2">
          <div class="flex items-center justify-between">
            <span class="font-bold text-sky-900 text-sm">Dost Asistan</span>
            <button onclick="speakText('Merhaba! Ben senin Dost Asistanınım. Sana yardım etmek için buradayım. Benimle konuşabilir veya yazabilirsin. Nasılsın?')" class="px-2 py-1 bg-sky-200 text-sky-900 rounded-lg text-xs font-bold hover:bg-sky-300 flex items-center space-x-1">
              <i class="ph-bold ph-speaker-high"></i>
              <span>Dinle</span>
            </button>
          </div>
          <p class="text-slate-800 leading-relaxed font-medium">
            Merhaba! Ben senin Dost Asistanınım. 🌸<br>
            Sana yardım etmek için buradayım. Benimle konuşabilir veya aşağıdaki kutuya yazabilirsin. Nasılsın?
          </p>
        </div>
      </div>
    </section>

    <!-- Input Section: Voice & Keyboard -->
    <section aria-label="Mesaj Gönderme Alanı" class="bg-white p-3 sm:p-4 rounded-2xl border-2 border-slate-200 shadow-sm flex flex-col gap-2">
      
      <!-- Microphone Status / Live Feedback -->
      <div id="mic-status" class="hidden text-center py-1 text-xs sm:text-sm font-bold text-rose-600 animate-pulse flex items-center justify-center space-x-2">
        <i class="ph-bold ph-microphone text-lg"></i>
        <span>Seni dinliyorum... Konuşabilirsin.</span>
      </div>

      <form id="chat-form" class="flex items-center gap-2" onsubmit="handleFormSubmit(event)">
        
        <!-- Large Speech Microphone Button -->
        <button type="button" id="btn-mic" onclick="toggleVoiceRecognition()" aria-label="Sesle Konuş" title="Sesle Konuşmak İçin Bas" class="h-14 w-14 sm:h-16 sm:w-16 bg-rose-500 hover:bg-rose-600 text-white rounded-2xl flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-md transition active:scale-95 focus:ring-4 focus:ring-rose-300 flex-shrink-0">
          <i class="ph-bold ph-microphone" id="mic-icon"></i>
        </button>

        <!-- Text Input Field -->
        <div class="flex-1 relative">
          <input type="text" id="user-input" placeholder="Buraya yazabilirsin..." aria-label="Mesajınızı yazın" class="w-full h-14 sm:h-16 px-4 bg-slate-50 border-2 border-slate-300 rounded-2xl text-base sm:text-lg font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white transition" />
        </div>

        <!-- Large Send Button -->
        <button type="submit" aria-label="Mesajı Gönder" title="Gönder" class="h-14 sm:h-16 px-5 sm:px-8 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-2xl flex items-center justify-center text-lg shadow-md transition active:scale-95 focus:ring-4 focus:ring-sky-300 flex-shrink-0 space-x-2">
          <span>Gönder</span>
          <i class="ph-bold ph-paper-plane-right text-xl"></i>
        </button>

      </form>
    </section>

  </main>

  <script>
    /* Global Accessibility State */
    let fontSizeLevel = 1; // 0: Small, 1: Normal, 2: Large, 3: Extra Large
    const fontClasses = ['text-sm', 'text-base', 'text-lg', 'text-xl'];
    let isHighContrast = false;
    let isMuted = false;
    let speechRate = 0.9; // Slightly slower default rate for better clarity
    let recognition = null;
    let isListening = false;

    // Speech Synthesis initialization
    const synth = window.speechSynthesis;

    // Initialize Web Speech Recognition
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        const micBtn = document.getElementById('btn-mic');
        const micIcon = document.getElementById('mic-icon');
        const status = document.getElementById('mic-status');
        
        micBtn.classList.add('bg-rose-600', 'recording-pulse');
        micIcon.className = 'ph-bold ph-microphone-slash';
        status.classList.remove('hidden');
      };

      recognition.onend = function() {
        isListening = false;
        const micBtn = document.getElementById('btn-mic');
        const micIcon = document.getElementById('mic-icon');
        const status = document.getElementById('mic-status');

        micBtn.classList.remove('bg-rose-600', 'recording-pulse');
        micIcon.className = 'ph-bold ph-microphone';
        status.classList.add('hidden');
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('user-input').value = transcript;
        processUserMessage(transcript);
      };

      recognition.onerror = function(event) {
        console.error("Speech recognition error", event.error);
        alertMessage("Seni tam duyamadım. Tekrar mikrofona basıp konuşabilirsin.");
      };
    } else {
      console.warn("Speech Recognition API is not supported in this browser.");
    }

    /* Accessibility Handlers */
    document.getElementById('btn-font-increase').addEventListener('click', () => {
      if (fontSizeLevel < fontClasses.length - 1) {
        fontSizeLevel++;
        updateFontSize();
      }
    });

    document.getElementById('btn-font-decrease').addEventListener('click', () => {
      if (fontSizeLevel > 0) {
        fontSizeLevel--;
        updateFontSize();
      }
    });

    function updateFontSize() {
      const chatBox = document.getElementById('chat-box');
      chatBox.className = chatBox.className.replace(/text-\w+/g, '');
      chatBox.classList.add(fontClasses[fontSizeLevel]);
    }

    document.getElementById('btn-contrast').addEventListener('click', () => {
      isHighContrast = !isHighContrast;
      document.body.classList.toggle('high-contrast', isHighContrast);
    });

    document.getElementById('btn-speech-speed').addEventListener('click', () => {
      const label = document.getElementById('speed-label');
      if (speechRate === 0.9) {
        speechRate = 0.7; // Very slow
        label.textContent = 'Çok Yavaş';
      } else if (speechRate === 0.7) {
        speechRate = 1.0; // Normal
        label.textContent = 'Hızlı';
      } else {
        speechRate = 0.9; // Default friendly speed
        label.textContent = 'Normal Hız';
      }
    });

    document.getElementById('btn-mute').addEventListener('click', () => {
      isMuted = !isMuted;
      const icon = document.getElementById('mute-icon');
      if (isMuted) {
        icon.className = 'ph-bold ph-speaker-x text-xl';
        synth.cancel();
      } else {
        icon.className = 'ph-bold ph-speaker-high text-xl';
      }
    });

    /* Voice Output Function (Text-To-Speech) */
    function speakText(text) {
      if (isMuted || !('speechSynthesis' in window)) return;

      // Cancel ongoing speech
      synth.cancel();

      // Clean emojis from speech text for cleaner voice output
      const cleanText = text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'tr-TR';
      utterance.rate = speechRate;
      utterance.pitch = 1.0;

      // Select Turkish voice if available
      const voices = synth.getVoices();
      const trVoice = voices.find(v => v.lang.includes('tr'));
      if (trVoice) {
        utterance.voice = trVoice;
      }

      synth.speak(utterance);
    }

    /* Voice Input Toggle */
    function toggleVoiceRecognition() {
      if (!recognition) {
        alertMessage("Üzgünüm, tarayıcınız ses tanıma özelliğini desteklemiyor. Yazarak iletişim kurabilirsiniz.");
        return;
      }

      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    /* Quick Prompt Trigger */
    function sendQuickPrompt(promptText) {
      document.getElementById('user-input').value = promptText;
      processUserMessage(promptText);
    }

    /* Form Submission Handler */
    function handleFormSubmit(event) {
      event.preventDefault();
      const inputEl = document.getElementById('user-input');
      const message = inputEl.value.trim();
      if (message) {
        processUserMessage(message);
        inputEl.value = '';
      }
    }

    /* Render User Message in Chat */
    function appendUserMessage(text) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-start justify-end space-x-3 max-w-2xl ml-auto';
      
      msgDiv.innerHTML = `
        <div class="bg-sky-600 text-white p-4 rounded-2xl border-2 border-sky-700 shadow-sm space-y-1">
          <div class="text-xs font-bold text-sky-200">Sen</div>
          <p class="leading-relaxed font-medium">${escapeHtml(text)}</p>
        </div>
        <div class="w-10 h-10 bg-slate-700 rounded-full flex items-center justify-center text-white text-xl flex-shrink-0">
          <i class="ph-bold ph-user"></i>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* Render Assistant Response in Chat & Trigger Speech */
    function appendAssistantMessage(text) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-start space-x-3 max-w-2xl';
      
      const uniqueId = 'msg-' + Date.now();

      msgDiv.innerHTML = `
        <div class="w-10 h-10 bg-sky-500 rounded-full flex items-center justify-center text-white text-xl flex-shrink-0">
          <i class="ph-bold ph-robot"></i>
        </div>
        <div class="bg-sky-50 p-4 rounded-2xl border-2 border-sky-100 shadow-sm space-y-2 flex-1">
          <div class="flex items-center justify-between">
            <span class="font-bold text-sky-900 text-sm">Dost Asistan</span>
            <button onclick="speakText(\`${escapeQuotes(text)}\`)" class="px-2 py-1 bg-sky-200 text-sky-900 rounded-lg text-xs font-bold hover:bg-sky-300 flex items-center space-x-1">
              <i class="ph-bold ph-speaker-high"></i>
              <span>Tekrar Dinle</span>
            </button>
          </div>
          <p class="text-slate-800 leading-relaxed font-medium">${text}</p>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Speak response automatically
      speakText(text);
    }

    /* Simple & Encouraging Assistant Logic (Tailored for Special Needs) */
    function generateAssistantResponse(userText) {
      const text = userText.toLowerCase();

      if (text.includes('merhaba') || text.includes('selam')) {
        return "Merhaba! Seni gördüğüme çok sevindim. Bugün nasılsın?";
      } 
      else if (text.includes('bugün ne yapayım') || text.includes('ne yapabilirim')) {
        return "Bugün harika şeyler yapabilirsin! 🌟\n1. En sevdiğin müziği dinleyebilirsin.\n2. Kısa bir yürüyüş yapabilirsin.\n3. Ya da resim çizebilirsin. Hangisini istersin?";
      } 
      else if (text.includes('duygu') || text.includes('hissediyorum')) {
        return "Duygularını paylaşman çok güzel. Kendini mutlu, yorgun veya biraz heyecanlı hissediyor olabilirsin. Hepsi çok normal! Derin bir nefes al, ben buradayım.";
      } 
      else if (text.includes('yardım')) {
        return "Yanındayım! Hiç endişelenme. Sakince adım adım halledebiliriz. Bana neye ihtiyacın olduğunu söyler misin?";
      } 
      else if (text.includes('rutin') || text.includes('günlük')) {
        return "Günlük adım önerilerim: ☀️\n1. Bir bardak su iç.\n2. Yüzünü yıka ve ferahla.\n3. Güzel bir yemek ye.\nAdım adım ilerlemek harikadır!";
      } 
      else if (text.includes('hava') || text.includes('giysi')) {
        return "Dışarı çıkmadan önce pencereden bakabilirsin. Hava soğuksa kalın bir hırka giymeyi unutma. Rahat giysiler seni mutlu eder!";
      } 
      else if (text.includes('söz') || text.includes('moral') || text.includes('güzel')) {
        return "Sana özel bir söz: 'Sen çok değerlisin ve kendi hızında ilerlemek en güzel şeydir.' Bugün gülümsemeyi unutma! ✨";
      } 
      else if (text.includes('teşekkür') || text.includes('sağol')) {
        return "Rica ederim! Seni dinlemek benim için büyük bir keyif. Her zaman buradayım.";
      } 
      else {
        return "Seni çok iyi anlıyorum. Bana anlatmak istediğin her şeyi dinlemeye hazırım. İstersen yukarıdaki renkli butonlara da dokunabilirsin.";
      }
    }

    function processUserMessage(message) {
      appendUserMessage(message);
      
      // Simulate brief, calm thinking delay
      setTimeout(() => {
        const response = generateAssistantResponse(message);
        appendAssistantMessage(response);
      }, 600);
    }

    function alertMessage(msg) {
      appendAssistantMessage(msg);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escapeQuotes(text) {
      return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    // Ensure speech synthesis voices are loaded
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
